<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Моя первая игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- Счёт игры -->
    <div id="score"></div>
    
    <!-- Мобильное управление -->
    <div id="mobileControls">
        <div class="control-row">
            <div class="control-button" id="btnUp">⬆️</div>
        </div>
        <div class="control-row">
            <div class="control-button" id="btnLeft">⬅️</div>
            <div class="control-button" id="btnDown">⬇️</div>
            <div class="control-button" id="btnRight">➡️</div>
        </div>
    </div>

    <!-- Главное меню -->
    <div id="mainMenu" class="menu">
        <h1>Моя первая игра</h1>
        <p>Собирай монеты, избегай врагов!</p>
        <button id="startBtn">Начать игру</button>
        <p class="controls-hint">Управление: стрелки или WASD | P - пауза | R - рестарт | Клик - стрельба</p>
    </div>

    <!-- Меню паузы -->
    <div id="pauseMenu" class="menu menu-hidden">
        <h2>Пауза</h2>
        <button id="resumeBtn">Продолжить</button>
        <button id="restartBtn">Начать заново</button>
        <button id="exitBtn">В меню</button>
    </div>

    <!-- Меню уровня -->
    <div id="levelMenu" class="menu menu-hidden">
        <h2>Уровень <span id="levelNumber"></span></h2>
        <p>Врагов до босса: <span id="levelEnemies"></span></p>
        <button id="nextLevelBtn">Следующий уровень</button>
    </div>

    <!-- Меню победы -->
    <div id="winMenu" class="menu menu-hidden">
        <h2>🎉 Победа! 🎉</h2>
        <p>Вы прошли все уровни!</p>
        <p>Ваш счёт: <span id="winScore"></span></p>
        <p>Пройдено уровней: <span id="winLevel"></span></p>
        <button id="playAgainBtn">Играть снова</button>
        <button id="exitWinBtn">В меню</button>
    </div>

    <!-- Меню проигрыша -->
    <div id="gameOverMenu" class="menu menu-hidden">
        <h2>💀 Игра окончена 💀</h2>
        <p>Ваш счёт: <span id="finalScore"></span></p>
        <p>Уровень: <span id="finalLevel"></span></p>
        <button id="retryBtn">Попробовать снова</button>
        <button id="exitLoseBtn">В меню</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
